name: sms-gateway

services:
  backend:
    image: ghcr.io/android-sms-gateway/server:latest
    environment:
      CONFIG_PATH: config.yml
      HTTP__LISTEN: 0.0.0.0:8080
      GATEWAY__MODE: private
      GATEWAY__PRIVATE_TOKEN: ${GATEWAY_PRIVATE_TOKEN}
      DATABASE__HOST: db
      DATABASE__PORT: 3306
      DATABASE__USER: ${MYSQL_USER:-sms}
      DATABASE__PASSWORD: ${MYSQL_PASSWORD:-sms}
      DATABASE__DATABASE: ${MYSQL_DATABASE:-sms}
      JWT__SECRET: ${JWT_SECRET}
    volumes:
      - ./config.yml:/app/config.yml:ro
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/android-sms-gateway/server:latest
    command: ["/app/app", "worker"]
    environment:
      CONFIG_PATH: config.yml
      GATEWAY__MODE: private
      GATEWAY__PRIVATE_TOKEN: ${GATEWAY_PRIVATE_TOKEN}
      DATABASE__HOST: db
      DATABASE__PORT: 3306
      DATABASE__USER: ${MYSQL_USER:-sms}
      DATABASE__PASSWORD: ${MYSQL_PASSWORD:-sms}
      DATABASE__DATABASE: ${MYSQL_DATABASE:-sms}
      JWT__SECRET: ${JWT_SECRET}
    volumes:
      - ./config.yml:/app/config.yml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: ghcr.io/android-sms-gateway/web-dashboard:latest
    environment:
      HTTP__ADDRESS: 0.0.0.0:8081
      GATEWAY__URL: ${DASHBOARD_GATEWAY_URL}
      GATEWAY__WEBHOOK_URL: ${DASHBOARD_WEBHOOK_URL}
    expose:
      - "8081"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: mariadb:lts
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sms}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sms}
      MYSQL_USER: ${MYSQL_USER:-sms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sms}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb-data-v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mariadb-data-v2:
